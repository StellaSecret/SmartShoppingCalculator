[package]
name = "smart-shopping-calculator"
version = "0.1.0"
edition = "2021"
description = "Compare products by real unit cost — toilet paper by €/g of paper, protein powder by €/g of protein. Rust + Dioxus port."

[dependencies]
dioxus = { version = "0.6", features = ["web"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gloo-storage = "0.3"
web-sys = { version = "0.3", features = ["Window", "MediaQueryList"] }

[profile.release]
opt-level = "z"
lto = true
