name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Job 1 : Rust check + WASM build ─────────────────────────────────────────
  check:
    name: Rust (check + WASM build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo check (wasm32-unknown-unknown)
        run: cargo check --target wasm32-unknown-unknown

      - name: cargo build --release (wasm32-unknown-unknown)
        run: cargo build --release --target wasm32-unknown-unknown

  # ─── Job 2 : Dioxus web bundle ───────────────────────────────────────────────
  build-web:
    name: Build WASM web bundle
    runs-on: ubuntu-latest
    needs: [check]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Dioxus CLI (v0.6.3, matches dioxus 0.6 in Cargo.toml)
        run: |
          curl -sSLO https://github.com/DioxusLabs/dioxus/releases/download/v0.6.3/dx-x86_64-unknown-linux-gnu-v0.6.3.tar.gz
          tar -xzf dx-x86_64-unknown-linux-gnu-v0.6.3.tar.gz
          install -m 755 dx /usr/local/bin/dx

      - name: Build WASM web bundle
        run: dx build --release --base-path /SmartShoppingCalculator/

      - name: Upload web bundle
        uses: actions/upload-artifact@v4
        with:
          name: wasm-public
          path: target/dx/smart-shopping-calculator/release/web/public/
          retention-days: 7

  # ─── Job 3 : Deploy GitHub Pages (main only) ─────────────────────────────────
  deploy-pages:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    needs: [build-web]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Download web bundle
        uses: actions/download-artifact@v4
        with:
          name: wasm-public
          path: public

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
